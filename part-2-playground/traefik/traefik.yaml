---
global: { checkNewVersion: false, sendAnonymousUsage: false }
entryPoints:
  web:
    address: :80
    http: { redirections: { entryPoint: { to: websecure, scheme: https, permanent: true } } }
  websecure:
    address: :443
    http: { tls: {} }
providers:
  file: { filename: /etc/traefik/dynamic.yaml }
  docker: { exposedByDefault: false }
log: { level: INFO }
accessLog: {}
