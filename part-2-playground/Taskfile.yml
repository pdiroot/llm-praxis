---
version: "3"

tasks:
  check:
    desc: Lint the shell scripts and the YAML files
    cmds:
      - shellcheck -x scripts/*.sh vm/*.sh slides/*.sh
      - shfmt -i 2 -d scripts vm slides
      - >-
        bash -c 'diff -u slides/prompts.js <(slides/build.sh /dev/stdout)
        || { echo "slides/prompts.js is stale: run task slides"; exit 1; }'
      - yamllint .
  slides:
    desc: Generate slides/prompts.js from prompts/*.md
    cmds:
      - slides/build.sh
  test:
    desc: Run the bats tests that need no running playground
    cmds:
      - bats --filter-tags '!live' tests
  test:live:
    desc: Run the bats tests that need the running playground, then reset it
    cmds:
      - bats --filter-tags live tests || { task reset; exit 1; }
      - task reset
  start:
    desc: Make the certificate and keys, start the playground and wait for GitLab
    cmds:
      - scripts/ca.sh ensure
      - scripts/ca.sh trust
      - scripts/certs.sh
      - scripts/ssh.sh keys
      - mkdir -p runtime/gitlab-trusted runtime/runner
      - cp runtime/tls/ca.crt runtime/gitlab-trusted/playground-ca.crt
      - docker compose up -d --build
      - >-
        bash -c 'source scripts/lib.sh;
        wait_http https://gitlab.playground.localhost/users/sign_in 200 900 || die "GitLab did not answer in 900 s"'
      - scripts/ssh.sh pin
      - scripts/bootstrap.sh
  smoke:
    desc: Prove the playground with four deploys of the smoke app, then empty the VMs
    cmds:
      - scripts/smoke.sh
  demo:
    interactive: true
    desc: Clone demo/whoami when missing, then start the demo Claude Code session
    cmds:
      - >-
        bash -c 'source scripts/lib.sh;
        [[ -d "$PG_RUNTIME/clone/whoami" ]] || git clone
        -c core.sshCommand="ssh -F \"$PG_RUNTIME/ssh/config\""
        ssh://git@gitlab.playground.localhost:2222/demo/whoami.git
        "$PG_RUNTIME/clone/whoami"'
      - scripts/demo-claude.sh
  reset:
    desc: Bring GitLab, the VMs and the demo Claude Code profile back to the start state
    cmds:
      - scripts/reset.sh
  checkpoint:
    desc: "Jump to a checkpoint of the session: task checkpoint -- 2-end"
    cmds:
      - scripts/checkpoint.sh {{.CLI_ARGS}}
  preflight:
    desc: Check the playground before a rehearsal or the session
    cmds:
      - scripts/preflight.sh
  stop:
    desc: Stop the containers and keep the data
    cmds:
      - docker compose stop
  status:
    desc: Show the containers and the answers of GitLab and Traefik
    cmds:
      - docker compose ps
      - >-
        bash -c 'source scripts/lib.sh;
        wait_http https://gitlab.playground.localhost/users/sign_in 200 5 && echo "gitlab: up" || echo "gitlab: down"'
  terminate:
    desc: Delete the containers, the volumes and runtime/ (never the root CA)
    cmds:
      - docker compose down -v
      - rm -rf runtime
